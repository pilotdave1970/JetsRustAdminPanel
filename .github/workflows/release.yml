name: Release
# Publishes a release for the number in VERSION whenever it changes on main (skipped if that tag exists).
on:
  push:
    branches: [main]
    paths: ["VERSION", "JetsAdminPanel.cs", "Setup.cs", "icon.ico", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          "ver=$ver" >> $env:GITHUB_OUTPUT
          "tag=v$ver" >> $env:GITHUB_OUTPUT
          gh release view "v$ver" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
      - name: Build
        if: steps.v.outputs.exists == 'false'
        run: |
          $ver = "${{ steps.v.outputs.ver }}"
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          foreach ($f in "JetsAdminPanel.cs","Setup.cs") {
            (Get-Content $f -Raw) -replace 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(`"$ver.0`")" -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(`"$ver.0`")" -replace 'const string Version = "[^"]*"', "const string Version = `"$ver`"" | Set-Content $f -Encoding UTF8
          }
          & $csc /nologo /target:winexe /optimize+ /win32icon:icon.ico /out:JetsAdminPanel.exe /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:System.Security.dll JetsAdminPanel.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $csc /nologo /target:winexe /optimize+ /win32icon:icon.ico /out:JetsAdminPanel-Setup.exe /resource:JetsAdminPanel.exe,app.exe /r:System.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll Setup.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" JetsAdminPanel.exe JetsAdminPanel-Setup.exe --target "${{ github.sha }}" --title "Jet's Admin Panel ${{ steps.v.outputs.tag }}" --generate-notes
